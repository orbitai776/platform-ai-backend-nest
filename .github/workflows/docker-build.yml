name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "stg", "dev" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/dev'
    environment: ${{ github.ref_name }}
    
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ env.REGISTRY }}
          ENV: ${{ vars.ENV }}
          PORT: ${{ vars.PORT }}
          CONTAINER: ${{ vars.CONTAINER }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          OLTP_AUTH: ${{ secrets.OLTP_AUTH }}
          OLTP_URL: ${{ secrets.OLTP_URL }}
        run: |
          # Deploy commands
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            echo "🔑 Logging to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Pulling image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            
            echo "🛑 Stopping old container..."
            docker stop $CONTAINER 2>/dev/null || true
            docker rm $CONTAINER 2>/dev/null || true
            
            echo "🚀 Starting new container on port $PORT..."
            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              -p $PORT:3000 \
              -e ENV=$ENV \
              -e PORT=3000 \
              -e FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID \
              -e FIREBASE_CLIENT_EMAIL=$FIREBASE_CLIENT_EMAIL \
              -e FIREBASE_PRIVATE_KEY="$FIREBASE_PRIVATE_KEY" \
              -e JWT_SECRET_KEY=$JWT_SECRET_KEY \
              -e JWT_EXPIRES_IN=$JWT_EXPIRES_IN \
              -e JWT_ISSUER=$JWT_ISSUER \
              -e JWT_AUDIENCE=$JWT_AUDIENCE \
              -e REDIS_URL=$REDIS_URL \
              -e DATABASE_URL=$DATABASE_URL \
              -e MONGO_URI=$MONGO_URI \
              -e NODE_ENV=$ENV \
              -e OLTP_AUTH=$OLTP_AUTH \
              -e OLTP_URL=$OLTP_URL \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            
            echo "✅ Deployment complete!"
            echo "📋 Container status:"
            docker ps | grep $CONTAINER
          EOF
  
  deploy-oracle:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg' || github.ref == 'refs/heads/dev'
    environment: ${{ github.ref_name }}
    
    steps:
      - name: Setup SSH for Oracle
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key_oracle
          chmod 600 ~/.ssh/deploy_key_oracle
          ssh-keyscan -H ${{ secrets.ORACLE_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Create K8s YAML file
        run: |
          echo "Creating Kubernetes service YAML for ${{ github.ref_name }}..."

          cat > service-ai-backend-nest-${{ github.ref_name }}.yaml << 'YAML'
          apiVersion: v1
          kind: Service
          metadata:
            name: platform-ai-backend-nest-${{ github.ref_name }}
          spec:
            type: NodePort
            selector:
              app: platform-ai-backend-nest-${{ github.ref_name }}
            ports:
            - port: 3000
              targetPort: 3000
              nodePort: ${{ vars.ORACLE_PORT }}
          YAML

          echo "Creating Kubernetes deployment YAML for ${{ github.ref_name }}..."

          cat > deployment-ai-backend-nest-${{ github.ref_name }}.yaml << 'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: platform-ai-backend-nest-${{ github.ref_name }}
            namespace: default
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: platform-ai-backend-nest-${{ github.ref_name }}
            template:
              metadata:
                labels:
                  app: platform-ai-backend-nest-${{ github.ref_name }}
              spec:
                containers:
                - name: app
                  image: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
                  imagePullPolicy: IfNotPresent
                  ports:
                  - containerPort: 3000
                  env:
                  - name: ENV
                    value: "${{ vars.ENV }}"
                  - name: PORT
                    value: "3000"
                  - name: FIREBASE_PROJECT_ID
                    value: "${{ secrets.FIREBASE_PROJECT_ID }}"
                  - name: FIREBASE_CLIENT_EMAIL
                    value: "${{ secrets.FIREBASE_CLIENT_EMAIL }}"
                  - name: FIREBASE_PRIVATE_KEY
                    value: "${{ secrets.FIREBASE_PRIVATE_KEY }}"
                  - name: JWT_SECRET_KEY
                    value: "${{ secrets.JWT_SECRET_KEY }}"
                  - name: JWT_AUDIENCE
                    value: "${{ secrets.JWT_AUDIENCE }}"
                  - name: REDIS_URL
                    value: "${{ secrets.REDIS_URL }}"
                  - name: JWT_EXPIRES_IN
                    value: "${{ secrets.JWT_EXPIRES_IN }}"
                  - name: JWT_ISSUER
                    value: "${{ secrets.JWT_ISSUER }}"
                  - name: DATABASE_URL
                    value: "${{ secrets.DATABASE_URL }}"
                  - name: MONGO_URI
                    value: "${{ secrets.MONGO_URI }}"
                  - name: NODE_ENV
                    value: "${{ vars.ENV }}"
                  - name: OLTP_AUTH
                    value: "${{ secrets.OLTP_AUTH }}"
                  - name: OLTP_URL
                    value: "${{ secrets.OLTP_URL }}"
          YAML

      - name: Deploy to Oracle VPS
        run: |
          scp -i ~/.ssh/deploy_key_oracle service-ai-backend-nest-${{ github.ref_name }}.yaml ${{ secrets.ORACLE_SERVER_USER }}@${{ secrets.ORACLE_SERVER_IP }}:/tmp/
          scp -i ~/.ssh/deploy_key_oracle deployment-ai-backend-nest-${{ github.ref_name }}.yaml ${{ secrets.ORACLE_SERVER_USER }}@${{ secrets.ORACLE_SERVER_IP }}:/tmp/
          
          ssh -i ~/.ssh/deploy_key_oracle ${{ secrets.ORACLE_SERVER_USER }}@${{ secrets.ORACLE_SERVER_IP }} << EOF

            echo "🔑 Logging to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "📦 Pulling image..."
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}

            echo "🚀 Applying service..."
            sudo k3s kubectl apply -f /tmp/service-ai-backend-nest-${{ github.ref_name }}.yaml

            echo "🚀 Applying deployment..."
            sudo k3s kubectl apply -f /tmp/deployment-ai-backend-nest-${{ github.ref_name }}.yaml

            echo "🔄 Restarting rollout..."
            sudo k3s kubectl rollout restart deployment/platform-ai-backend-nest-${{ github.ref_name }} -n default
            
            echo "✅ Deployment status:"
            sudo k3s kubectl get pods -n default | grep platform-ai-backend-nest-${{ github.ref_name }}
          EOF